<div class="instruction-banner">
  <h2>Ingrese lo que generó este mes</h2>
</div>

<div class="ingresos-grid">
  
  <!-- Contenedor del KPI de Ingresos -->
  <div class="kpi-ingresos-box">
    <div class="kpi-header">
      <span class="kpi-title">Ingreso de este mes</span>
      <img src="ingresos.jpg" alt="ingreso de este mes" class="kpi-icon" />
    </div>
    <div class="kpi-blue-card card-input-wrapper">
      <span class="currency-symbol">Q.</span>
      <input 
        type="number" 
        class="custom-ingreso-input" 
        [(ngModel)]="ingresoMes" 
        (ngModelChange)="guardarIngreso()"
        placeholder="0.00" 
        step="0.01" 
        min="0"
      />
    </div>
  </div>

  <!-- Tabla de Gastos -->
  <div class="gastos-table-container">
    <div class="table-pill-header">
      <span>Gastos del mes</span>
    </div>

    <table class="gastos-table">
      <thead>
        <tr>
          <th>Gastos</th>
          <th>Dinero a pagar</th>
        </tr>
      </thead>
      <tbody>
        
        <tr *ngFor="let gasto of listaGastos; let i = index">
          <td>
            <textarea 
              [(ngModel)]="gasto.concepto" 
              placeholder="Ingrese datos" 
              class="table-input bold-text textarea-auto"
              rows="1"
            ></textarea>
          </td>
          <td class="monto-cell">
            <span class="currency-label">Q.</span>
            <input 
              type="number" 
              [(ngModel)]="gasto.monto" 
              (ngModelChange)="actualizarBalances()"
              placeholder="0.00" 
              step="0.01"
              min="0"
              class="table-input monto-input"
            />
          </td>
        </tr>

        <tr class="add-row-tr" (click)="agregarFila()">
          <td colspan="2" class="add-row-btn">
            <strong>Agregar fila (+)</strong>
          </td>
        </tr>

        <tr class="total-row-tr">
          <td class="total-label">
            <strong>Total a pagar</strong>
          </td>
          <td class="total-value">
            <strong>Q. {{ calcularTotalGastos() | number:'1.2-2' }}</strong>
          </td>
        </tr>

      </tbody>
    </table>
  </div>

</div>
